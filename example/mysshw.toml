# mysshw 配置示例 (v26.07.04.0+)
# 完整字段参考: https://github.com/cnphpbb/mysshw/blob/master/readme.md#config
# MCP 集成文档: https://github.com/cnphpbb/mysshw/blob/master/examples/mcp-integration.md
#
# 字段约定:
#   - "必填" 字段不可省略, 省略会导致 LoadViperConfig 失败
#   - "可选" 字段省略时使用默认值
#   - 密码字段推荐用 ${MYSSHW_PWD_xxx} env 引用, 或 bcrypt 哈希, 避免明文落盘
#   - 单个 SSH 节点在同一 group 内 name 必须唯一
#   - alias 在全局配置中应唯一, 方便 --node <alias> 定位
#   - keypath 指定后 validator 会检查文件存在; 示例中所有 keypath 都注释掉了
#     用户启用密钥认证时, 请把 keypath 解开并改成自己的路径

# ============================================================
# 顶层字段
# ============================================================

# cfg_dir: 配置目录路径 (留空 → $HOME/.mysshw.toml)
# cfg_dir = "~/.mysshw/"

# known_hosts_path: 自定义主机指纹存储路径
# 留空 → ~/.ssh/known_hosts (与 OpenSSH 共享)
# 路径支持 ~ 和 $HOME 展开; 父目录不存在时会自动创建
# known_hosts_path = "~/.mysshw/known_hosts"

# backup_keep: 写 TOML 时保留的本地备份数量
# 留空或 ≤0 → 默认 5
# 备份命名: <name>.<YYYYMMDD_HHMMSS>.bak, atomic rename 保证原子性
# backup_keep = 5


# ============================================================
# 密码 / 认证字段格式 (4 种方式, 推荐度递减)
# ============================================================
# password / passphrase 字段支持 4 种格式; mysshw 自动检测并按类型处理:
#
# 1. ${ENV} 引用 (推荐)
#    password = "${MYSSHW_PWD_node1}"
#    运行时由 ssh.ResolveEnvRef 解析为 $MYSSHW_PWD_node1 的值
#    list 输出的 auth 字段: "env"
#    适用: 容器 / K8s Secret / 部署到多台机器时统一管理
#
# 2. bcrypt 哈希 (推荐, 防止明文落盘)
#    password = "$2a$10$xxxxx..."  (60 字符, 必须以 $2a$/$2b$/$2y$ 开头)
#    运行时 prompt 交互输入明文 → bcrypt.CompareHashAndPassword 验证
#    list 输出的 auth 字段: "bcrypt"
#    适用: 静态配置文件 + 多人共享, 任何明文都不应直接落盘
#    生成工具: go run 下面的 helper, 或直接调 config.HashPassword(plain)
#
# 3. 明文 (⚠️ 不推荐)
#    password = "my-secret-password"
#    list 输出的 auth 字段: "password"
#    适用: 一次性测试环境; 生产环境绝不应该用
#
# 4. 空 + keypath (推荐用于纯密钥认证)
#    password = ""
#    keypath = "~/.ssh/id_ed25519"
#    list 输出的 auth 字段: "key" (有 keypath + 无 password)
#    适用: 自动化 / CI / 跳板机


# ============================================================
# 同步配置 (sync 命令, 把本配置分发到远端)
# ============================================================

[sync]
# type: 同步协议, 必填
#   scp     → 通过 SSH 通道 SCP 传输
#   webdav  → WebDAV 协议
#   s3      → S3 兼容存储 (AWS S3 / MinIO / RustFS)
type = "scp"

remote_uri = "127.0.0.1:22"
remote_path = "/data/backup/mysshw/mysshw.toml" # remote file path

# === scp 协议配置 ===
[sync.scp]
username = "root"
# password 方式 1: ${ENV} 引用 (推荐)
password = "${MYSSHW_PWD_sync}"
# keypath = "~/.ssh/id_rsa"   # 启用时 validator 会校验文件存在
# passphrase = "${MYSSHW_KEY_PASSPHRASE:-}"

# === webdav 协议配置 ===
[sync.webdav]
auth = "Basic" # Basic || Digest
username = "root"
password = "${MYSSHW_PWD_webdav}"

# === s3 协议配置 ===
[sync.s3]
access_key = "${MYSSHW_S3_ACCESS_KEY}"   # 访问密钥
secret_key = "${MYSSHW_S3_SECRET_KEY}"   # 密钥
bucket_name = "mysshw-backup"            # 桶名
region = "us-east-1"                     # 区域
endpoint = ""                            # 终端节点; 留空按 remote_uri 解析


# ============================================================
# SSH 节点配置 (演示 4 种 auth 方式)
# ============================================================
# 每个 [[nodes]] 块代表一个 group, group 内可定义多个 SSH 节点
# --group 参数批量筛选, --node 重复用于批量操作

# --- Group 1: Production ---
[[nodes]]
groups = "Production"

# 节点 1.1: password = ${ENV} 引用 (推荐, K8s Secret)
# 运行时: ssh.ResolveEnvRef 解析为 $MYSSHW_PWD_prod_web_1 的值
# list 输出: auth="env"
[[nodes.ssh]]
name = "prod-web-1"
alias = "Web01"
host = "10.0.0.1"
user = "app"
port = 22
password = "${MYSSHW_PWD_prod_web_1}"

# 节点 1.2: password = bcrypt 哈希 (推荐, 防明文落盘)
# 运行时: prompt 提示输入明文 → bcrypt.CompareHashAndPassword 验证
# list 输出: auth="bcrypt"
# 生成新哈希: go run <(echo 'package main;import("fmt";"golang.org/x/crypto/bcrypt");func main(){h,_:=bcrypt.GenerateFromPassword([]byte("your-password"),bcrypt.DefaultCost);fmt.Println(string(h))}')
[[nodes.ssh]]
name = "prod-db-1"
alias = "DB01"
host = "10.0.0.5"
user = "postgres"
port = 5432
# 明文: "prod-db-password-2024" (仅供演示, 真实部署应该走 K8s Secret)
password = "$2a$10$BBEDysNBBCnf/RwKMLiea.ufVrsybvoes.HYz8w.6wtff7TSLhjsC"
proxy = "bastion"

# 节点 1.3: password = 明文 (⚠️ 仅测试用, 不推荐生产)
# list 输出: auth="password"
[[nodes.ssh]]
name = "prod-test-1"
host = "10.0.0.99"
user = "app"
password = "test-password-do-not-use-in-prod"
strict_host_key_checking = false

# 节点 1.4: 纯密钥认证 (推荐用于 CI / 自动化 / 跳板)
# list 输出: auth="key"
[[nodes.ssh]]
name = "prod-deploy-1"
alias = "DeployBot"
host = "10.0.0.50"
user = "deploy"
# keypath = "~/.ssh/id_ed25519"   # 启用密钥认证
# 密码字段留空

# --- Group 2: Staging ---
[[nodes]]
groups = "Staging"

[[nodes.ssh]]
name = "stag-web-1"
alias = "StagWeb"
host = "192.168.10.10"
user = "deploy"
password = "${MYSSHW_PWD_stag_web_1}"

# --- Group 3: DevOps (跳板机集中管理) ---
[[nodes]]
groups = "DevOps"

# 节点 3.1: 跳板机 (其它节点的 proxy 引用此节点)
[[nodes.ssh]]
name = "bastion"
host = "bastion.example.com"
user = "ops"
port = 2222
# 跳板机通常用密钥认证
# keypath = "~/.ssh/id_bastion"

# 节点 3.2: 通过 bastion 访问的内网机器
[[nodes.ssh]]
name = "internal-app-1"
host = "172.16.0.5"
user = "app"
password = "${MYSSHW_PWD_internal_app_1}"
proxy = "bastion"

# --- Group 4: Batch (内联数组写法, 节点多时方便) ---
[[nodes]]
groups = "Batch"
# 内联数组写法, 适合节点多且配置相似的场景
# 3 个节点都引用同一个 env 变量
ssh = [
    { name="batch-1", host="10.1.0.1", user="worker", password="${MYSSHW_PWD_batch}" },
    { name="batch-2", host="10.1.0.2", user="worker", password="${MYSSHW_PWD_batch}" },
    { name="batch-3", host="10.1.0.3", user="worker", password="${MYSSHW_PWD_batch}" },
]


# ============================================================
# 主机指纹管理说明
# ============================================================
# mysshw 默认在 ~/.ssh/known_hosts 校验主机指纹 (与 OpenSSH 共享)
# 推荐: `mysshw hostkey` 子命令 (MCP 也暴露为 ssh_hostkey_*)
#   list                                  列出全部条目
#   show <host>                           查看指定 host 指纹
#   remove <host>                         删除条目
#   update <host> --node <name>           主动重取并更新 (合法 key rotation)
#   audit [--check-config]                健康度审计
#
# 合法 key rotation 推荐流程:
#   1. admin 通过安全渠道告知新 fingerprint (SHA256:xxx)
#   2. AI 调 hostkey update <host> --node <name> \
#            --expect-fingerprint SHA256:xxx --confirm
#   3. 验证更新成功
#   4. 后续 ssh_exec/copy 走严格校验, 无需额外 flag
#
# ⚠️ rotate_known_hosts 字段已弃用, 保留仅为兼容; 新代码请用 hostkey update
