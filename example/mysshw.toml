# mysshw 配置示例 (v26.07.04.0+)
# 完整字段参考: https://github.com/cnphpbb/mysshw/blob/master/readme.md#config
# MCP 集成文档: https://github.com/cnphpbb/mysshw/blob/master/examples/mcp-integration.md
#
# 字段约定:
#   - "必填" 字段不可省略, 省略会导致 LoadViperConfig 失败
#   - "可选" 字段省略时使用默认值
#   - 密码字段推荐用 ${MYSSHW_PWD_xxx} env 引用, 或 bcrypt 哈希, 避免明文落盘
#   - 单个 SSH 节点在同一 group 内 name 必须唯一
#   - alias 在全局配置中应唯一, 方便 --node <alias> 定位
#   - keypath 指定后 validator 会检查文件存在; 示例中所有 keypath 都注释掉了
#     用户启用密钥认证时, 请把 keypath 解开并改成自己的路径

# ============================================================
# 顶层字段
# ============================================================

# cfg_dir: 历史遗留字段, 当前未读取 (死代码).
#   配置文件路径实际由 --cfg flag 或 $HOME/.mysshw.toml 默认值决定
#   (见 config/utils.go::CFGPATH 常量).
#   推荐: 保留这一行以便知道这个字段不存在, 或直接删除.
#   后续如果需要"配置目录"语义 (e.g. 多文件分拆配置), 会另行设计.
# cfg_dir = "~/.mysshw.toml"   # 死代码, 实际未被读取

# known_hosts_path: 自定义主机指纹存储路径
# 留空 → ~/.ssh/known_hosts (与 OpenSSH 共享)
# 路径支持 ~ 和 $HOME 展开; 父目录不存在时会自动创建
# known_hosts_path = "~/.mysshw/known_hosts"

# backup_keep: 写 TOML 时保留的本地备份数量
# 留空或 ≤0 → 默认 5
# 备份命名: <name>.<YYYYMMDD_HHMMSS>.bak, atomic rename 保证原子性
# backup_keep = 5

# encryption_algorithm: 密码字段的 KDF 算法 (v26.07.04.1+ 计划)
#   ""             → 默认: 自动检测 (bcrypt / env / 明文), v26.07.04.0 行为
#   "bcrypt"       → 标准 bcrypt 哈希 (兼容, v26.07.04.0 唯一识别的算法)
#   "bcrypt-pepper" → bcrypt + 服务器侧 secret_key (静态 pepper), 防纯 hash 泄露
#   "argon2id"     → Argon2id 哈希 (推荐, 抗 GPU/ASIC 攻击, OWASP 推荐)
#   "pbkdf2-sha256" → PBKDF2-HMAC-SHA256 (NIST SP 800-132 推荐)
# 当前版本: 会解析该字段, 但运行时仍按 v26.07.04.0 逻辑 (60字符 $2x$ 前缀即视为 bcrypt)
# 迁移提示: v26.07.04.1+ 会根据该字段 + secret_key 计算/验证 hash
# encryption_algorithm = "bcrypt-pepper"

# secret_key: 服务器侧静态 secret ("pepper"), 与 password hash 结合 (v26.07.04.1+ 计划)
# 适用: 即使配置文件泄露, 攻击者仍需拿到 server 侧 secret 才能离线爆破
# 推荐: 引用 env 而非明文 (类似 K8s Secret 机制)
# 当前版本: 解析该字段但未应用
# secret_key = "${MYSSHW_SECRET_KEY}"

# cipher: 文件级加密的对称算法 (v26.07.04.1+ 计划)
#   ""                    → 不加密, v26.07.04.0 行为
#   "aes-256-gcm"         → AES-256-GCM (推荐, 主流硬件加速)
#   "chacha20-poly1305"   → ChaCha20-Poly1305 (ARM / 移动优化)
# 当前版本: 解析该字段但未应用
# cipher = "aes-256-gcm"

# kdf_params: KDF 调优参数 (v26.07.04.1+ 计划)
# 示例: kdf_params = "{\"time\":3,\"memory\":65536,\"threads\":2}"
# 当前版本: 解析该字段但未应用
# kdf_params = "{\"time\":3,\"memory\":65536,\"threads\":2}"


# ============================================================
# 密码 / 认证字段格式 (4 种方式, 推荐度递减)
# ============================================================
# password / passphrase 字段支持 4 种格式; mysshw 自动检测并按类型处理:
#
# 1. ${ENV} 引用 (推荐)
#    password = "${MYSSHW_PWD_node1}"
#    运行时由 ssh.ResolveEnvRef 解析为 $MYSSHW_PWD_node1 的值
#    list 输出的 auth 字段: "env"
#    适用: 容器 / K8s Secret / 部署到多台机器时统一管理
#
# 2. bcrypt 哈希 (推荐, 防止明文落盘)
#    password = "$2a$10$xxxxx..."  (60 字符, 必须以 $2a$/$2b$/$2y$ 开头)
#    运行时 prompt 交互输入明文 → bcrypt.CompareHashAndPassword 验证
#    list 输出的 auth 字段: "bcrypt"
#    适用: 静态配置文件 + 多人共享, 任何明文都不应直接落盘
#    生成工具: go run 下面的 helper, 或直接调 config.HashPassword(plain)
#
# 3. 明文 (⚠️ 不推荐)
#    password = "my-secret-password"
#    list 输出的 auth 字段: "password"
#    适用: 一次性测试环境; 生产环境绝不应该用
#
# 4. 空 + keypath (推荐用于纯密钥认证)
#    password = ""
#    keypath = "~/.ssh/id_ed25519"
#    list 输出的 auth 字段: "key" (有 keypath + 无 password)
#    适用: 自动化 / CI / 跳板机


# ============================================================
# 文件级加密 (Phase C, v26.07.04.0+)
# ============================================================
# 整个 mysshw.toml 支持 passphrase 加密, 防止配置文件泄露后
# 明文 password / keypath / proxy 等敏感字段被读取.
#
# 加密格式 (二进制, 37-byte header + N-byte ciphertext):
#   magic(4 'MSEC') | kdf_id(1) | salt(16) | nonce(12) | ct_len(4) | ciphertext(N)
#
# 算法: Argon2id (time=3, memory=64MB, threads=4) + AES-256-GCM
#       魔数 'MSEC' (mysshw Encrypted Config) 用于自动检测
#
# Workflow:
#   # 加密 (in-place, 默认行为)
#   echo "$passphrase" | mysshw encrypt -c ~/.mysshw.toml
#
#   # 加密到新文件
#   echo "$passphrase" | mysshw encrypt -c in.toml --out encrypted.toml
#
#   # 使用加密文件 (load 时自动 prompt passphrase)
#   echo "$passphrase" | mysshw list -c encrypted.toml -o json
#
#   # 解密回明文
#   echo "$passphrase" | mysshw encrypt decrypt -c encrypted.toml --out plain.toml
#
# 安全提示:
#   - passphrase 丢失 = 数据丢失 (服务器没有任何方式恢复)
#   - 加密文件本身可以共享 (KDF salt 公开), 但 passphrase 绝对不能
#   - 错 passphrase / 篡改 ciphertext → AES-GCM auth tag 验证失败 → 报错
#   - Argon2id (64MB) 单次派生 ~300-500ms, 防 GPU 暴力
#   - 旧版无 magic header 的明文 .toml 仍然兼容 (LoadViperConfig 自动检测)


# ============================================================
# 同步配置 (sync 命令, 把本配置分发到远端)
# ============================================================

[sync]
# type: 同步协议, 必填
#   scp     → 通过 SSH 通道 SCP 传输
#   webdav  → WebDAV 协议
#   s3      → S3 兼容存储 (AWS S3 / MinIO / RustFS)
type = "scp"

remote_uri = "127.0.0.1:22"
remote_path = "/data/backup/mysshw/mysshw.toml" # remote file path

# encrypt: 上传前是否加密 (v26.07.05+)
#   true  (默认) → 本地配置用 Argon2id + AES-256-GCM 加密后再上传
#                 远程服务器上只存在密文, 即使远程被入侵, 备份也无法被拖走解密
#   false         → 明文上传 (⚠️ 不推荐, 远程会持有明文配置)
# 覆盖方式: 命令行 --encrypt=false 优先于本字段
encrypt = true

# passphrase: 同步加解密口令 (v26.07.05+)
#   优先级: 环境变量 (默认 MYSSHW_SYNC_PASSPHRASE) > 本字段 > 交互输入
#   本字段支持 ${VAR} / ${VAR:-default} 引用, 推荐写成 env 引用而不是明文
#   口令丢失 = 远程密文无法恢复, 请务必妥善保存
# passphrase = "${MYSSHW_SYNC_PASSPHRASE}"

# === scp 协议配置 ===
# 认证方式 (按优先级, 命中即用; keypath 与 password 可同时配置, 互为回退):
#   1. keypath   → 公钥认证 (私钥口令取 passphrase, 支持 ${ENV} 引用)
#   2. password  → 密码认证 (支持 ${ENV} 引用)
#   3. SSH Agent → 公钥认证 (前两者都没配时自动回退; 适合 cron / CI)
# 主机指纹: 与普通 SSH 登录共用 ~/.ssh/known_hosts, 采用 TOFU 策略
#   (首次连接写入, 之后指纹不符直接拒绝; MYSSHW_SKIP_HOST_KEY_CHECK=true 可临时跳过)
[sync.scp]
username = "root"
# password 方式 1: ${ENV} 引用 (推荐)
password = "${MYSSHW_PWD_sync}"
# 方式 2: 私钥 (私钥优先于密码)
# keypath = "~/.ssh/id_ed25519"
# passphrase = "${MYSSHW_KEY_PASSPHRASE:-}"   # 私钥口令, 可省略

# === webdav 协议配置 ===
[sync.webdav]
auth = "Basic" # Basic || Digest
username = "root"
password = "${MYSSHW_PWD_webdav}"

# === s3 协议配置 ===
[sync.s3]
access_key = "${MYSSHW_S3_ACCESS_KEY}"   # 访问密钥
secret_key = "${MYSSHW_S3_SECRET_KEY}"   # 密钥
bucket_name = "mysshw-backup"            # 桶名
region = "us-east-1"                     # 区域
endpoint = ""                            # 终端节点; 留空按 remote_uri 解析


# ============================================================
# SSH 节点配置 (演示 4 种 auth 方式)
# ============================================================
# 每个 [[nodes]] 块代表一个 group, group 内可定义多个 SSH 节点
# --group 参数批量筛选, --node 重复用于批量操作

# --- Group 1: Production ---
[[nodes]]
groups = "Production"

# 节点 1.1: password = ${ENV} 引用 (推荐, K8s Secret)
# 运行时: ssh.ResolveEnvRef 解析为 $MYSSHW_PWD_prod_web_1 的值
# list 输出: auth="env"
[[nodes.ssh]]
name = "prod-web-1"
alias = "Web01"
host = "10.0.0.1"
user = "app"
port = 22
password = "${MYSSHW_PWD_prod_web_1}"

# 节点 1.2: password = bcrypt 哈希 (推荐, 防明文落盘)
# 运行时: prompt 提示输入明文 → bcrypt.CompareHashAndPassword 验证
# list 输出: auth="bcrypt"
# 生成新哈希: go run <(echo 'package main;import("fmt";"golang.org/x/crypto/bcrypt");func main(){h,_:=bcrypt.GenerateFromPassword([]byte("your-password"),bcrypt.DefaultCost);fmt.Println(string(h))}')
[[nodes.ssh]]
name = "prod-db-1"
alias = "DB01"
host = "10.0.0.5"
user = "postgres"
port = 5432
# 明文: "prod-db-password-2024" (仅供演示, 真实部署应该走 K8s Secret)
password = "$2a$10$BBEDysNBBCnf/RwKMLiea.ufVrsybvoes.HYz8w.6wtff7TSLhjsC"
proxy = "bastion"

# 节点 1.3: password = 明文 (⚠️ 仅测试用, 不推荐生产)
# list 输出: auth="password"
[[nodes.ssh]]
name = "prod-test-1"
host = "10.0.0.99"
user = "app"
password = "test-password-do-not-use-in-prod"
strict_host_key_checking = false

# 节点 1.4: 纯密钥认证 (推荐用于 CI / 自动化 / 跳板)
# list 输出: auth="key"
[[nodes.ssh]]
name = "prod-deploy-1"
alias = "DeployBot"
host = "10.0.0.50"
user = "deploy"
# keypath = "~/.ssh/id_ed25519"   # 启用密钥认证
# 密码字段留空

# 节点 1.5: bcrypt + secret_key pepper (v26.07.04.1+)
# 机制: password 字段仍然是 $2a$10$... bcrypt 哈希, 但运行时
#       会用顶层 secret_key 做 HMAC 二次认证.
#       优点: 即使 config 文件泄露, 攻击者仍需拿到 server 侧 secret 才能离线爆破.
# 依赖: 顶层 encryption_algorithm = "bcrypt-pepper" + secret_key = "..."
# 运行时 (v26.07.04.1+): 用户输入明文 → bcrypt 验证 → 用 secret_key 做 HMAC 二次验证
# 当前版本 (v26.07.04.0): 仅检测为 bcrypt, secret_key 未参与验证 (forward-compatible)
# list 输出 (v26.07.04.1+): auth="bcrypt-pepper"
[[nodes.ssh]]
name = "prod-secure-1"
alias = "SecureDB"
host = "10.0.0.200"
user = "postgres"
# 明文: "super-secret-db-password" (生成器在文件末尾)
# 预期配合顶层 secret_key = "${MYSSHW_SECRET_KEY}" 使用
password = "$2a$10$BBEDysNBBCnf/RwKMLiea.ufVrsybvoes.HYz8w.6wtff7TSLhjsC"

# --- Group 2: Staging ---
[[nodes]]
groups = "Staging"

[[nodes.ssh]]
name = "stag-web-1"
alias = "StagWeb"
host = "192.168.10.10"
user = "deploy"
password = "${MYSSHW_PWD_stag_web_1}"

# --- Group 3: DevOps (跳板机集中管理) ---
[[nodes]]
groups = "DevOps"

# 节点 3.1: 跳板机 (其它节点的 proxy 引用此节点)
[[nodes.ssh]]
name = "bastion"
host = "bastion.example.com"
user = "ops"
port = 2222
# 跳板机通常用密钥认证
# keypath = "~/.ssh/id_bastion"

# 节点 3.2: 通过 bastion 访问的内网机器
[[nodes.ssh]]
name = "internal-app-1"
host = "172.16.0.5"
user = "app"
password = "${MYSSHW_PWD_internal_app_1}"
proxy = "bastion"

# --- Group 4: Batch (内联数组写法, 节点多时方便) ---
[[nodes]]
groups = "Batch"
# 内联数组写法, 适合节点多且配置相似的场景
# 3 个节点都引用同一个 env 变量
ssh = [
    { name="batch-1", host="10.1.0.1", user="worker", password="${MYSSHW_PWD_batch}" },
    { name="batch-2", host="10.1.0.2", user="worker", password="${MYSSHW_PWD_batch}" },
    { name="batch-3", host="10.1.0.3", user="worker", password="${MYSSHW_PWD_batch}" },
]


# ============================================================
# 主机指纹管理说明
# ============================================================
# mysshw 默认在 ~/.ssh/known_hosts 校验主机指纹 (与 OpenSSH 共享)
# 推荐: `mysshw hostkey` 子命令 (MCP 也暴露为 ssh_hostkey_*)
#   list                                  列出全部条目
#   show <host>                           查看指定 host 指纹
#   remove <host>                         删除条目
#   update <host> --node <name>           主动重取并更新 (合法 key rotation)
#   audit [--check-config]                健康度审计
#
# 合法 key rotation 推荐流程:
#   1. admin 通过安全渠道告知新 fingerprint (SHA256:xxx)
#   2. AI 调 hostkey update <host> --node <name> \
#            --expect-fingerprint SHA256:xxx --confirm
#   3. 验证更新成功
#   4. 后续 ssh_exec/copy 走严格校验, 无需额外 flag
#
# ⚠️ rotate_known_hosts 字段已弃用, 保留仅为兼容; 新代码请用 hostkey update


# ============================================================
# Helper: 生成 bcrypt 哈希 / secret_key
# ============================================================
# 以下是 Go 单文件, 供运维在本地生成新哈希时使用:
#
# // genhash.go
# package main
#
# import (
#     "fmt"
#     "os"
#     "golang.org/x/crypto/bcrypt"
# )
#
# func main() {
#     pwd := os.Args[1]
#     h, _ := bcrypt.GenerateFromPassword([]byte(pwd), bcrypt.DefaultCost)
#     fmt.Println(string(h))
# }
#
# 用法:
#   go run genhash.go "your-password"
#   # 输出: $2a$10$xxxxx...  (60 字符, 复制到 password 字段)
#
# 未来 v26.07.04.1+ 计划提供 mysshw 原生命令:
#   mysshw hash gen <plaintext>             # 生成 bcrypt 哈希
#   mysshw hash gen --algo=argon2id <plain> # 生成 Argon2id
#   mysshw hash verify <hash> <plain>       # 验证哈希是否匹配
#   mysshw hash pepper                      # 生成新的 secret_key (随机 32 字节)
#
# 变更 secret_key 的 workflow (v26.07.04.1+ 计划):
#   1. 备份: cp mysshw.toml mysshw.toml.bak
#   2. 生成新 secret: openssl rand -base64 32 (或 mysshw hash pepper)
#   3. 更新配置: secret_key = "<新 secret>"
#   4. 逐节点重哈希: 对每个 bcrypt 节点调 mysshw hash gen --with-pepper <新明文>
#      (mysshw 内部用 旧 secret 验证 + 新 secret 重新 hash)
#   5. 验证: mysshw list (确保所有节点仍然可解析)
#   6. 删除备份: rm mysshw.toml.bak (验证后)
